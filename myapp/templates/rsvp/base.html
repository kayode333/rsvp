<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Modern RSVP App{% endblock %}</title>
    <link rel="icon" type="image" href="{% static 'images/rsvp.png'%}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --light: #f8fafc;
            --dark: #0f172a;
            --gray: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --card-bg: #ffffff;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--gray);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Navigation Styles */
        .navbar {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            position: relative;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-link {
            color: var(--dark);
            font-weight: 500;
            transition: var(--transition);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .nav-link:hover {
            color: var(--primary);
            background-color: #f0f9ff;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--dark);
        }

        .app-container {
            grid-template-columns: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        @media (min-width: 992px) {
            .app-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            width: 100%;
        }

        .form-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 15px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background-color: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 1.1rem;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--dark);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .alert {
            padding: 16px 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.5s ease;
            width: 100%;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert i {
            font-size: 1.2rem;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid #e2e8f0;
            width: 100%;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 15px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .event-card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .event-card h3 i {
            color: var(--primary);
        }

        .event-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            color: var(--dark);
        }

        .attendee-list {
            margin-top: 20px;
        }

        .attendee-list h4 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .attendee-item {
            padding: 14px;
            background: #f8fafc;
            margin-bottom: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            transition: var(--transition);
            width: 100%;
        }

        .attendee-item:hover {
            background: #f1f5f9;
            transform: translateX(5px);
        }

        .attendee-name {
            font-weight: 600;
            color: var(--dark);
        }

        .attendee-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-confirmed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .capacity-warning {
            color: var(--error);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            width: 100%;
        }

        .capacity-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
            width: 100%;
        }

        .capacity-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .event-date {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Remove underline from all links */
        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;
        }

        /* Responsive design for mobile devices */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px;
            }
            
            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 70%;
                background-color: var(--card-bg);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: var(--transition);
                box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
                z-index: 100;
                gap: 30px;
            }

            .nav-menu.active {
                right: 0;
            }

            .nav-toggle {
                display: block;
            }

            .app-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .event-info {
                flex-direction: column;
                gap: 15px;
            }
            
            .event-actions {
                flex-direction: column;
            }
            
            /* Make buttons full width on mobile */
            .btn, .btn-sm {
                width: 100%;
            }
            
            /* Adjust padding for smaller screens */
            .form-section {
                padding: 20px;
            }
            
            .event-card {
                padding: 20px;
            }
            
            /* Adjust font sizes for better readability on small screens */
            .section-title {
                font-size: 1.3rem;
            }
            
            .event-card h3 {
                font-size: 1.2rem;
            }
            
            .info-label {
                font-size: 0.8rem;
            }
            
            .info-value {
                font-size: 0.95rem;
            }
            
            .attendee-list h4 {
                font-size: 1rem;
            }
            
            .attendee-name {
                font-size: 0.95rem;
            }
            
            .attendee-status {
                font-size: 0.8rem;
            }
        }

        /* Additional responsive adjustments for very small screens */
        @media (max-width: 480px) {
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .form-group label {
                font-size: 0.9rem;
            }
            
            .form-control {
                padding: 12px;
                font-size: 0.95rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 0.95rem;
            }
            
            .btn-sm {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .event-card {
                padding: 15px;
            }
            
            .event-info {
                gap: 10px;
            }
            
            .info-item {
                min-width: 120px;
            }
            
            .nav-menu {
                width: 85%;
            }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--gray);
            font-size: 0.9rem;
            width: 100%;
            max-width: 1200px;
        }
        
        /* Add custom icons for events */
        .event-card .fas.fa-glass-cheers::before {
            content: "\f5e3";
        }
        
        .event-card .fas.fa-music::before {
            content: "\f001";
        }
        
        .event-card .fas.fa-utensils::before {
            content: "\f2e7";
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <a href="{% url 'index' %}" class="nav-brand">
                <i class="fas fa-calendar-check"></i> RSVP App
            </a>
            <ul class="nav-menu">
                <li><a href="{% url 'index' %}" class="nav-link">Home</a></li>
                <li><a href="{% url 'create_event' %}" class="nav-link">Create Event</a></li>
            </ul>
            <button class="nav-toggle" id="nav-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </nav>

        <div class="content-wrapper">
            <header class="header">
                <h1><i class="fas fa-calendar-check"></i> Modern RSVP App</h1>
                <p>Manage your events and track attendees with our sleek, responsive interface</p>
            </header>
            
            <div class="app-container">
                {% block content %}
                <!-- Content will be inserted here by child templates -->
                {% endblock %}
            </div>
            
            <footer class="footer">
                <p>Modern RSVP App &copy; 2025 | Designed for seamless event management</p>
            </footer>
        </div>

        <script>
            // Mobile Navigation Toggle
            const navToggle = document.getElementById('nav-toggle');
            const navMenu = document.querySelector('.nav-menu');

            navToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        </script>
    </div>
</body>
</html>
